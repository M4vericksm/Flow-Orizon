name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: floworizon
          POSTGRES_USER: floworizon
          POSTGRES_PASSWORD: floworizon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U floworizon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SECRET_KEY: ci-secret-key-not-for-production-0123456789
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: floworizon
      POSTGRES_USER: floworizon
      POSTGRES_PASSWORD: floworizon
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: pytest --cov=apps --cov-report=term-missing

  e2e-tests:
    name: End-to-end tests (Selenium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create backend env file
        run: cp backend/.env.example backend/.env

      - name: Start the stack
        run: docker compose up -d --build

      - name: Wait for the backend
        run: |
          for i in $(seq 1 40); do
            if curl -sf http://localhost:8000/api/health/ >/dev/null; then
              echo "backend up"; exit 0
            fi
            sleep 3
          done
          echo "backend did not start in time"; exit 1

      - name: Wait for the frontend
        run: |
          for i in $(seq 1 40); do
            if curl -sf http://localhost:5173/ >/dev/null; then
              echo "frontend up"; exit 0
            fi
            sleep 3
          done
          echo "frontend did not start in time"; exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install e2e dependencies
        run: pip install -r e2e/requirements.txt

      - name: Run selenium tests
        working-directory: e2e
        run: pytest -v

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose logs
