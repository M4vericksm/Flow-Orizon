services:
  db:
    image: postgres:16
    container_name: flow-orizon-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-floworizon}
      POSTGRES_USER: ${POSTGRES_USER:-floworizon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-floworizon}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-floworizon}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flow-orizon-backend
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
